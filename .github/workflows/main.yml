
name: Galgalatz News Recorder V2.2

"on":
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: galgalatz-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare FFmpeg and Python
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python3 -m pip install --user numpy scipy

      - name: Wait for news
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          import time
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          now = datetime.now(timezone.utc)
          israel = ZoneInfo("Asia/Jerusalem")

          target = now.replace(
              minute=0, second=0, microsecond=0
          ) + timedelta(hours=1)

          if os.environ["EVENT_NAME"] == "schedule":
              if now.minute < 30:
                  raise SystemExit(
                      "Scheduled job missed its window."
                  )

          wait = target.timestamp() - time.time()

          if wait > 35 * 60:
              raise SystemExit(
                  "Recording target too far away."
              )

          print(
              "Recording target:",
              target.astimezone(israel).isoformat(),
              flush=True
          )

          print(
              f"Waiting {wait:.1f} seconds",
              flush=True
          )

          if wait > 0:
              time.sleep(wait)
          PY

      - name: Record 4 minutes
        shell: bash
        run: |
          mkdir -p recordings

          ffmpeg -nostdin -y \
            -i "https://glzwizzlv.bynetcdn.com/glglz_mp3" \
            -t 240 \
            -c:a libmp3lame \
            -b:a 128k \
            recordings/original.mp3

      - name: Detect and trim news intro
        shell: bash
        run: |
          python3 detect_intro.py \
            recordings/original.mp3 \
            news-intro-reference.mp3 \
            recordings/latest.mp3

      - name: Verify final recording
        shell: bash
        run: |
          test -s recordings/latest.mp3

          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            recordings/latest.mp3

          ffmpeg -v error \
            -i recordings/latest.mp3 \
            -f null -

      - name: Publish latest recording
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add recordings/latest.mp3

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "Update latest news recording"
          git push
