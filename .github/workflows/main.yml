
name: Galgalatz Hourly News Recorder

on:
  schedule:
    - cron: '50 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Wait until next full hour
        shell: bash
        run: |
          python3 - <<'PY'
          import time
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Asia/Jerusalem")
          now = datetime.now(tz)
          target = now.replace(minute=0, second=0, microsecond=0) + timedelta(hours=1)

          wait = target.timestamp() - time.time()

          if wait > 0:
              print(f"Waiting {wait:.0f} seconds until {target.isoformat()}", flush=True)
              time.sleep(wait)
          else:
              raise SystemExit("Missed target time")
          PY

      - name: Record Galgalatz for 3 minutes
        shell: bash
        run: |
          ffmpeg -nostdin -y \
            -i "https://glzwizzlv.bynetcdn.com/glglz_mp3" \
            -t 180 \
            -c:a libmp3lame \
            -b:a 128k \
            galgalatz-news.mp3

      - name: Upload recording
        uses: actions/upload-artifact@v4
        with:
          name: galgalatz-news
          path: galgalatz-news.mp3
          if-no-files-found: error
          retention-days: 7
