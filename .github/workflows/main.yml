name: Test Galgalatz Recording

"on":
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Record Galgalatz
        run: |
          ffmpeg -y \
            -i "https://glzwizzlv.bynetcdn.com/glglz_mp3" \
            -t 180 \
            galgalatz-test.mp3

      - name: Upload recording
        uses: actions/upload-artifact@v4
        with:
          name: galgalatz-test
          path: galgalatz-test.mp3
