name: Galgalatz News Recorder V2.3

"on":
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: galgalatz-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare FFmpeg and Python
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python3 -m pip install --user numpy scipy

      - name: Wait for news
        id: timing
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import time
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          now = datetime.now(timezone.utc)
          israel = ZoneInfo("Asia/Jerusalem")

          target = now.replace(
              minute=0, second=0, microsecond=0
          ) + timedelta(hours=1)

          wait = target.timestamp() - time.time()

          if wait > 35 * 60:
              print(
                  "Too late for this recording. Skipping.",
                  flush=True
              )
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("should_record=false\n")
              raise SystemExit(0)

          print(
              "Recording target:",
              target.astimezone(israel).isoformat(),
              flush=True
          )
          print(
              f"Waiting {wait:.0f} seconds",
              flush=True
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("should_record=true\n")

          if wait > 0:
              time.sleep(wait)
          PY

      - name: Record 5 minutes
        if: steps.timing.outputs.should_record == 'true'
        shell: bash
        run: |
          mkdir -p recordings

          ffmpeg -nostdin -y \
            -i "https://glzwizzlv.bynetcdn.com/glglz_mp3" \
            -t 300 \
            -c:a libmp3lame \
            -b:a 128k \
            recordings/original.mp3

      - name: Detect and trim news intro
        if: steps.timing.outputs.should_record == 'true'
        shell: bash
        run: |
          python3 detect_intro.py \
            recordings/original.mp3 \
            news-intro-reference.mp3 \
            recordings/latest.mp3

      - name: Verify final recording
        if: steps.timing.outputs.should_record == 'true'
        shell: bash
        run: |
          test -s recordings/latest.mp3

          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            recordings/latest.mp3

          ffmpeg -v error \
            -i recordings/latest.mp3 \
            -f null -

      - name: Publish latest recording
        if: steps.timing.outputs.should_record == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add recordings/latest.mp3

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "Update latest news recording"
          git push
