
name: Galgalatz Hourly News Recorder

"on":
  schedule:
    - cron: '40 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Wait for scheduled recording time
        shell: bash
        run: |
          python3 - <<'PY'
          import time
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Asia/Jerusalem")

          # GitHub schedules workflows using UTC.
          # The intended recording hour is the first full
          # UTC hour after the scheduled minute 40.
          event = "${{ github.event_name }}"

          if event == "schedule":
              # The scheduled event is intended for minute 40.
              # Accept only runs starting before the next hour.
              now = datetime.now(timezone.utc)
              target = now.replace(
                  minute=0, second=0, microsecond=0
              ) + timedelta(hours=1)

              # If started too late in the hour,
              # do not wait for the following hour.
              if now.minute < 40:
                  raise SystemExit(
                      "Scheduled run started too late. "
                      "Skipping this recording."
                  )
          else:
              # Manual test: target the next full hour.
              now = datetime.now(timezone.utc)
              target = now.replace(
                  minute=0, second=0, microsecond=0
              ) + timedelta(hours=1)

          wait = target.timestamp() - time.time()

          if wait > 25 * 60:
              raise SystemExit(
                  "Target is too far away. "
                  "Skipping this recording."
              )

          print(
              "Recording scheduled for:",
              target.astimezone(tz).isoformat(),
              flush=True
          )
          print(
              f"Waiting {wait:.0f} seconds",
              flush=True
          )

          if wait > 0:
              time.sleep(wait)
          PY

      - name: Record Galgalatz for 3 minutes
        shell: bash
        run: |
          ffmpeg -nostdin -y \
            -i "https://glzwizzlv.bynetcdn.com/glglz_mp3" \
            -t 180 \
            -c:a libmp3lame \
            -b:a 128k \
            galgalatz-news.mp3

      - name: Verify recording
        run: |
          ls -lh galgalatz-news.mp3
          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            galgalatz-news.mp3

      - name: Upload recording
        uses: actions/upload-artifact@v4
        with:
          name: galgalatz-news
          path: galgalatz-news.mp3
          if-no-files-found: error
          retention-days: 7
