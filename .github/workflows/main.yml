
name: Galgalatz Hourly News Recorder

"on":
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: galgalatz-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check FFmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Wait until recording time
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          import time
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          now = datetime.now(timezone.utc)
          event = os.environ["EVENT_NAME"]

          target = now.replace(
              minute=0,
              second=0,
              microsecond=0
          ) + timedelta(hours=1)

          # Scheduled jobs should arrive between
          # minute 30 and minute 59.
          if event == "schedule":
              if now.minute < 30:
                  raise SystemExit(
                      "Scheduled run missed its recording "
                      "window. Skipping."
                  )

          wait = target.timestamp() - time.time()

          if wait > 35 * 60:
              raise SystemExit(
                  "Recording time too far away. Skipping."
              )

          israel = ZoneInfo("Asia/Jerusalem")

          print(
              "Current Israel time:",
              now.astimezone(israel).isoformat(),
              flush=True
          )
          print(
              "Recording target:",
              target.astimezone(israel).isoformat(),
              flush=True
          )
          print(
              f"Waiting {wait:.1f} seconds",
              flush=True
          )

          if wait > 0:
              time.sleep(wait)
          PY

      - name: Record Galgalatz
        shell: bash
        run: |
          mkdir -p recordings

          ffmpeg -nostdin -y \
            -i "https://glzwizzlv.bynetcdn.com/glglz_mp3" \
            -t 180 \
            -c:a libmp3lame \
            -b:a 128k \
            recordings/latest.mp3

      - name: Verify MP3
        shell: bash
        run: |
          test -s recordings/latest.mp3

          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            recordings/latest.mp3

          ffmpeg -v error \
            -i recordings/latest.mp3 \
            -f null -

      - name: Save MP3 to GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add recordings/latest.mp3

          if git diff --cached --quiet; then
            echo "No changes to save."
            exit 0
          fi

          git commit -m "Update latest Galgalatz recording"

          git push
