name: Test Galgalatz Recording

on:
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Record Galgalatz
        run: ffmpeg -y -i "https://glzwizzlv.bynetcdn.com/glglz_mp3" -t 60 galgalatz-test.mp3

      - name: Upload recording
        uses: actions/upload-artifact@v4
        with:
          name: galgalatz-test
          path: galgalatz-test.mp3
