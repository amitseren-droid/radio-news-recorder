name: Galgalatz News Recorder V2.6

"on":
  schedule:
    - cron: '25,40 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/main.yml'
      - 'news_worker.py'
      - 'tests/test_news_worker.py'
      - 'tests/player.test.cjs'
      - 'player.js'
      - 'index.html'

permissions:
  contents: read

# No global concurrency lock: the second scheduled attempt must not wait
# behind the first. Publication uses non-force push and per-bulletin metadata.
jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run timing and publication tests
        run: |
          /usr/bin/python3 -m unittest discover -s tests -p 'test_news_worker.py' -v
          node tests/player.test.cjs

  record:
    needs: validate
    # A tested update also prepares a real recording for the next full hour.
    # Scheduled/manual runs continue when the push-only validation job is skipped.
    # Cancelled runs and failed validations must never start a recording.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name != 'push' || needs.validate.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Select bulletin hour before preparation
        id: plan
        run: /usr/bin/python3 news_worker.py plan

      - name: Prepare recording tools
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y --no-install-recommends ffmpeg python3-numpy python3-scipy
          /usr/bin/python3 -c "import numpy, scipy"
          ffmpeg -version

      - name: Capture, trim, validate and publish
        env:
          TARGET_EPOCH: ${{ steps.plan.outputs.target }}
        run: /usr/bin/python3 news_worker.py record --target "$TARGET_EPOCH"
